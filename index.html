<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trivia Total</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0f0e14">
<style>
  @font-face {
    font-family: 'Marquee';
    src: local('Arial Black');
  }

  :root{
    --bg: #0f0e14;
    --bg2: #17151f;
    --gold: #e8b44a;
    --red: #c7402c;
    --cream: #f2efe9;
    --slate: #7a7688;
    --green: #4a9d6f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Georgia', 'Times New Roman', serif;
    overscroll-behavior: none;
    height: 100%;
    width: 100%;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height: 100dvh;
  }

  #app{
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    position: relative;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 38px, rgba(232,180,74,0.03) 38px, rgba(232,180,74,0.03) 40px),
      radial-gradient(ellipse at top, #201d2a 0%, var(--bg) 60%);
  }

  /* sprocket strip */
  .sprockets{
    display:flex;
    justify-content:space-between;
    padding: 6px 14px;
    background: #0a090d;
  }
  .sprockets span{
    width: 10px; height: 10px;
    background: var(--bg);
    border-radius: 2px;
    display:inline-block;
  }

  header{
    text-align:center;
    padding: 18px 20px 10px;
    border-bottom: 1px solid rgba(232,180,74,0.15);
  }

  h1{
    font-family: Impact, 'Arial Narrow', sans-serif;
    letter-spacing: 3px;
    font-size: 1.6rem;
    margin: 0;
    color: var(--gold);
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(232,180,74,0.35);
  }

  .subtitle{
    font-size: 0.72rem;
    letter-spacing: 2px;
    color: var(--slate);
    text-transform: uppercase;
    margin-top: 4px;
  }

  #hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 14px 20px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--slate);
  }

  #hud .stat b{ color: var(--cream); font-size: 1rem; }

  #progressWrap{
    height: 4px;
    margin: 0 20px 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  #progressBar{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    transition: width 0.4s ease;
  }

  main{
    flex: 1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: 10px 20px 30px;
  }

  #category{
    text-align:center;
    color: var(--red);
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: Arial, sans-serif;
  }

  #question{
    text-align:center;
    font-size: 1.35rem;
    line-height: 1.4;
    margin-bottom: 28px;
    min-height: 100px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0 4px;
  }

  #answers{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .answer{
    font-family: Arial, sans-serif;
    background: var(--bg2);
    border: 1px solid rgba(232,180,74,0.25);
    color: var(--cream);
    padding: 16px 18px;
    border-radius: 10px;
    font-size: 1rem;
    text-align: left;
    display:flex;
    align-items:center;
    gap: 12px;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    user-select: none;
  }
  .answer:active{ transform: scale(0.97); }

  .answer .letter{
    flex-shrink:0;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size: 0.8rem;
    font-family: 'Courier New', monospace;
  }

  .answer.correct{
    background: rgba(74,157,111,0.18);
    border-color: var(--green);
  }
  .answer.correct .letter{ border-color: var(--green); color: var(--green); }

  .answer.wrong{
    background: rgba(199,64,44,0.18);
    border-color: var(--red);
  }
  .answer.wrong .letter{ border-color: var(--red); color: var(--red); }

  .answer.disabled{ pointer-events: none; opacity: 0.55; }
  .answer.disabled.correct, .answer.disabled.wrong{ opacity: 1; }

  #feedback{
    text-align:center;
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
    min-height: 20px;
    margin-top: 16px;
    color: var(--slate);
  }

  #nextBtn{
    margin-top: 20px;
    align-self:center;
    background: var(--gold);
    color: #1a1710;
    border: none;
    padding: 13px 34px;
    border-radius: 30px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 0.95rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    display:none;
  }
  #nextBtn:active{ transform: scale(0.96); }

  /* End screen */
  #endScreen{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 20px 30px;
    text-align:center;
  }
  .ticket{
    background: var(--bg2);
    border: 2px dashed rgba(232,180,74,0.4);
    border-radius: 14px;
    padding: 30px 24px;
    width: 100%;
  }
  #finalScore{
    font-family: Impact, sans-serif;
    font-size: 3.2rem;
    color: var(--gold);
    margin: 6px 0;
  }
  #rank{
    font-family: Arial, sans-serif;
    color: var(--cream);
    font-size: 1.1rem;
    margin-bottom: 4px;
  }
  #rankDesc{
    font-family: Arial, sans-serif;
    color: var(--slate);
    font-size: 0.85rem;
    margin-bottom: 22px;
  }
  #restartBtn{
    background: var(--red);
    color: var(--cream);
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #restartBtn:active{ transform: scale(0.96); }

  footer{
    text-align:center;
    padding: 10px;
    font-size: 0.65rem;
    color: #454150;
    letter-spacing: 1px;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

<div id="app">
  <div class="sprockets">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>
    <h1>Trivia Total</h1>
    <div class="subtitle">Cultura general, ciencia, historia y más</div>
  </header>

  <div id="hud">
    <div class="stat">Pregunta <b id="qIndex">1</b>/<span id="qTotal">10</span></div>
    <div class="stat">Racha <b id="streak">0</b>🔥</div>
    <div class="stat">Puntos <b id="score">0</b></div>
  </div>
  <div id="progressWrap"><div id="progressBar"></div></div>

  <main id="quizScreen">
    <div id="category">Categoría</div>
    <div id="question">Cargando...</div>
    <div id="answers"></div>
    <div id="feedback"></div>
    <button id="nextBtn">Siguiente ▶</button>
  </main>

  <div id="endScreen">
    <div class="ticket">
      <div class="subtitle" style="color:var(--slate)">Resultado final</div>
      <div id="finalScore">0/10</div>
      <div id="rank">—</div>
      <div id="rankDesc">—</div>
      <button id="restartBtn">Jugar de nuevo</button>
    </div>
  </div>

  <div class="sprockets">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <footer>TOCA UNA RESPUESTA PARA JUGAR</footer>
</div>

const TOTAL_QUESTIONS = 12;
let deck = [];
let current = 0;
let score = 0;
let streak = 0;
let answered = false;

const qIndexEl = document.getElementById('qIndex');
const qTotalEl = document.getElementById('qTotal');
const streakEl = document.getElementById('streak');
const scoreEl = document.getElementById('score');
const progressBar = document.getElementById('progressBar');
const categoryEl = document.getElementById('category');
const questionEl = document.getElementById('question');
const answersEl = document.getElementById('answers');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizScreen = document.getElementById('quizScreen');
const endScreen = document.getElementById('endScreen');
const finalScoreEl = document.getElementById('finalScore');
const rankEl = document.getElementById('rank');
const rankDescEl = document.getElementById('rankDesc');
const restartBtn = document.getElementById('restartBtn');

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame(){
  deck = shuffle(QUESTIONS).slice(0, TOTAL_QUESTIONS);
  current = 0;
  score = 0;
  streak = 0;
  qTotalEl.textContent = deck.length;
  endScreen.style.display = 'none';
  quizScreen.style.display = 'flex';
  updateHud();
  loadQuestion();
}

function updateHud(){
  qIndexEl.textContent = current + 1;
  streakEl.textContent = streak;
  scoreEl.textContent = score;
  progressBar.style.width = ((current) / deck.length * 100) + '%';
}

function loadQuestion(){
  answered = false;
  feedbackEl.textContent = '';
  nextBtn.style.display = 'none';
  updateHud();

  const item = deck[current];
  categoryEl.textContent = item.cat;
  questionEl.textContent = item.q;
  answersEl.innerHTML = '';

  const letters = ['A','B','C','D'];
  item.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'answer';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i, item.correct, btn));
    answersEl.appendChild(btn);
  });
}

function selectAnswer(chosen, correctIndex, btnEl){
  if(answered) return;
  answered = true;

  const allBtns = answersEl.querySelectorAll('.answer');
  allBtns.forEach(b => b.classList.add('disabled'));

  if(chosen === correctIndex){
    btnEl.classList.add('correct');
    score += 10 + streak * 2;
    streak++;
    feedbackEl.textContent = '¡Correcto! 🎬';
    feedbackEl.style.color = 'var(--green)';
  } else {
    btnEl.classList.add('wrong');
    allBtns[correctIndex].classList.add('correct');
    streak = 0;
    feedbackEl.textContent = 'Incorrecto';
    feedbackEl.style.color = 'var(--red)';
  }

  updateHud();
  nextBtn.style.display = 'block';
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current >= deck.length){
    showEnd();
  } else {
    loadQuestion();
  }
});

function showEnd(){
  quizScreen.style.display = 'none';
  endScreen.style.display = 'flex';
  progressBar.style.width = '100%';

  const maxScore = deck.length * 10;
  finalScoreEl.textContent = `${score} pts`;

  const pct = score / (maxScore * 1.4); // account for streak bonus loosely
  let rank, desc;
  if(pct >= 0.85){ rank = '🏆 Cinéfilo experto'; desc = 'Conoces el cine mejor que muchos críticos.'; }
  else if(pct >= 0.6){ rank = '🎬 Amante del cine'; desc = 'Buen ojo, pero aún hay clásicos por descubrir.'; }
  else if(pct >= 0.35){ rank = '🍿 Espectador casual'; desc = 'Vas por buen camino, sigue viendo películas.'; }
  else { rank = '📼 Novato de la sala'; desc = '¡Es hora de una maratón de cine!'; }

  rankEl.textContent = rank;
  rankDescEl.textContent = desc;
}

restartBtn.addEventListener('click', startGame);

startGame();
</script>
